chinese_media:
  - name: AI HOT
    category: chinese_media
    source_family: broad_discovery_surface
    weight: high
    authority_tier: 2
    # 匿名只读 v1 API：结构化 JSON 比首页 HTML（JS 壳）稳，且每条自带 links.original
    # 供一跳官方补证。它是中文圈召回对照面，不是证据源——候选仍按 media 降档处理。
    # publishedAt 可为 null，此时回退 discoveredAt 并按 published_at_confidence: inferred。
    # 两层的分工是刻意的：selected 是高门槛策展池（实测当日只放行约 8% 条目），它空
    # 只说明"策展没放行"，不等于中文圈无新闻 —— 所以标 static，空必须下穿 mode=all
    # 全量池；all 才是真·全量倒序面，空即权威。
    cadence: daily
    fetch_chain:
      - type: webfetch
        url: https://aihot.virxact.com/api/v1/items?mode=selected&window=24h&limit=50
        surface_kind: static
      - type: webfetch
        url: https://aihot.virxact.com/api/v1/items?mode=all&window=24h&limit=50
        surface_kind: feed
      - type: websearch_scoped
        queries:
          - "AI HOT site:aihot.virxact.com {date}"
          - "AI HOT coding agent site:aihot.virxact.com {date}"

