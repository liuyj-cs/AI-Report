# 读者画像：AI 编辑做相关性与决策影响判断的输入。
# roles 是长期角色；decisions_in_flight 是在途决策（radar 按它分组）；
# practice_focus 锚定 agent_ecosystem 的相关性判断。过期决策应删除或归档。

roles:
  - id: coding_agent_selection
    description: 公司 coding agent 方案选型负责人
  - id: workplace_ai_enablement
    description: 公司非技术人员 AI Agent 方案负责人
  - id: ai_coding_adoption_lead
    description: 技术总监，负责团队 AI coding 推进与最佳实践沉淀
  - id: agent_power_user
    description: 开发工程师，深度使用 Claude Code / Codex

decisions_in_flight:
  - name: coding-agent-2026H2
    description: 公司 coding agent 选型
    candidates: [Claude Code, Codex, Cursor, GitHub Copilot]
    criteria: [企业管控/SSO/审计, 定价与席位, 模型路由灵活性, CN 可用性]
  - name: workplace-ai
    description: 非技术员工 AI agent 方案
    candidates: [Microsoft 365 Copilot, ChatGPT Enterprise, 飞书/钉钉 AI]
    criteria: [非技术上手成本, 数据合规, 部署形态]

practice_focus:
  - 团队级 agent 工作流（code review / 测试 / CI 集成 / 多 agent 编排）
  - Claude Code / Codex 的 skills、插件、MCP 生态
  - AI coding 推广度量与治理（采纳率、效率度量、权限管控）

# 访谈关注对象：interview 轨道的发现参数化输入。seeds 是种子，AI 可顺名追人/追新职位。
interview_watchlist:
  - id: anthropic_leadership
    org: Anthropic
    seeds: [Dario Amodei, Daniela Amodei, Jared Kaplan, Tom Brown, Chris Olah]
  - id: openai_leadership
    org: OpenAI
    seeds: [Sam Altman, Greg Brockman]
  - id: product_eng_leads
    org: Anthropic/OpenAI
    note: Claude Code / Codex / ChatGPT / API 产品线工程与产品负责人（如 Fiona Fung）
  - id: frontier_lab_others
    org: DeepMind 等
    note: DeepMind（Demis Hassabis 等）+ 头部 coding agent 产品负责人（Cursor / GitHub 等）

# 任务矩阵用于补漏和解释相关性，不是固定入选名单或厂商排名。
workplace_task_coverage:
  - task: 研究、检索与资料整理
    sources: [ChatGPT Enterprise Release Notes, Claude Release Notes, Google Workspace Updates]
    questions: [可追溯来源, 持续任务, 导出结果]
  - task: 文档、演示、表格与数据工作
    sources: [Microsoft 365 Copilot Release Notes, Claude Release Notes, 飞书更新日志, 钉钉悟空更新日志]
    questions: [支持的操作与格式, 数据权限, 协作交付物]
  - task: 浏览器与桌面执行
    sources: [ChatGPT Enterprise Release Notes, Claude Release Notes, 钉钉悟空更新日志]
    questions: [读写边界, 人工接管, 失败恢复, 适用系统]
  - task: 企业跨系统工作流
    sources: [Microsoft 365 Copilot Release Notes, Google Workspace Updates, 飞书更新日志, 钉钉悟空更新日志]
    questions: [执行身份, 连接器, 写入对象, 任务闭环]
  - task: 部署与组织管理
    sources: [ChatGPT Enterprise Release Notes, Microsoft 365 Copilot Release Notes, Claude Release Notes]
    questions: [套餐与区域, 审计, 管理员控制, 数据边界]
  - task: 开放发现
    sources: [General Agent Search Queries, High-Signal Media Discovery]
    questions: [新对象, 官方补证, 对目标任务的实际价值]
