name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r skills/ai-daily-report/requirements.txt
      - name: Run tests
        working-directory: skills/ai-daily-report
        run: python -m pytest tests -q
